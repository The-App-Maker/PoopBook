<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body { background-color: #5d4037; color: #fff; font-family: 'Comic Sans MS', cursive; text-align: center; }
        .post { background: #8d6e63; border: 5px solid #3e2723; padding: 20px; margin: 20px auto; width: 60%; border-radius: 20px; transition: 0.5s; }
        .flush-btn { background: #03a9f4; border: none; padding: 10px 20px; color: white; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .flush-btn:hover { background: #0288d1; }
        .flushed { transform: translateY(100vh) rotate(360deg); opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <h1>P💩💩PBOOK</h1>
    <div id="feed">
        <!-- A poopy post -->
        <div class="post" id="post-1">
            <p>"Just had a triple-decker bean burrito. Wish me luck."</p>
            <button class="flush-btn" onclick="flushPost('post-1')">FLUSH IT! 🚽</button>
        </div>
        
        <!-- A non-poopy post that needs flushing -->
        <div class="post" id="post-2">
            <p>"I am posting a very serious stock market update."</p>
            <button class="flush-btn" onclick="flushPost('post-2')">FLUSH IT! 🚽</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
